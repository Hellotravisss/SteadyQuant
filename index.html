<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>省心量化 (SteadyQuant) - 小白理财神器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00f2ff; --glass: rgba(255,255,255,0.03); }
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-active { border-bottom: 3px solid var(--accent); color: var(--accent); }
        .step-badge { display:inline-block; background: var(--accent); color: black; padding: 2px 8px; border-radius: 99px; font-weight: 800; font-size: 10px; margin-right: 8px; }
        input, select { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.15) !important; color: white !important; border-radius: 0.75rem; padding: 0.75rem 1rem; width: 100%; }
        input:focus, select:focus { outline: none; border-color: var(--accent) !important; }
        .stock-card { transition: all 0.2s; cursor: pointer; }
        .stock-card:hover { border-color: var(--accent) !important; transform: translateY(-2px); box-shadow: 0 0 16px rgba(0,242,255,0.2); }
        #searchSuggestions div:hover { background: rgba(255,255,255,0.08); cursor: pointer; }
        .loading-dots::after { content: ''; animation: dots 1.2s steps(4,end) infinite; }
        @keyframes dots { 0%,100%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
    </style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-6xl mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-center mb-8">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-cyan-500 rounded-xl flex items-center justify-center text-black font-black text-2xl">S</div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tighter leading-none">Steady<span class="text-cyan-400">Quant</span></h1>
                <p class="text-slate-500 text-xs">省心量化 · 小白理财神器</p>
            </div>
        </div>
        <div class="text-right">
            <div class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">当前本金</div>
            <div id="displayBalance" class="text-xl font-bold text-cyan-400">¥2,000.00</div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- ===== 左侧控制面板 ===== -->
        <aside class="lg:col-span-4 space-y-4">

            <!-- 模式切换 -->
            <div class="glass rounded-2xl p-1 flex">
                <button id="mode1Tab" onclick="switchMode(1)"
                    class="flex-1 py-3 text-sm font-bold rounded-xl tab-active transition-all">
                    模式一：【一键选股】
                </button>
                <button id="mode2Tab" onclick="switchMode(2)"
                    class="flex-1 py-3 text-sm font-bold text-slate-500 transition-all">
                    模式二：【深度回测】
                </button>
            </div>

            <!-- ---- 模式一面板 ---- -->
            <div id="mode1Panel" class="glass rounded-3xl p-6 space-y-5">
                <div>
                    <div class="flex items-center mb-3"><span class="step-badge">1</span><span class="text-sm font-bold">设置理财条件</span></div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">本金 (CNY)</label>
                    <input id="principalInput" type="number" value="2000" min="100">
                    <p class="text-[10px] text-slate-600 mt-1">* 本金决定筛选股价上限，本金越小股价门槛越低</p>
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold uppercase block mb-1">风险偏好</label>
                    <select id="riskSelect">
                        <option value="stable">稳健型 · PE&lt;15，股息&gt;4%</option>
                        <option value="growth">成长型 · PE&lt;25，股息&gt;2.5%</option>
                    </select>
                </div>
                <div>
                    <div class="flex items-center mb-3"><span class="step-badge">2</span><span class="text-sm font-bold">扫描优质股</span></div>
                    <button id="scanBtn" onclick="doScan()"
                        class="w-full py-4 bg-cyan-400 text-black font-black rounded-2xl hover:bg-cyan-300 transition-all text-sm">
                        开启量化扫描
                    </button>
                </div>
                <div>
                    <div class="flex items-center"><span class="step-badge">3</span><span class="text-sm font-bold">点击下方卡片 → 自动回测</span></div>
                </div>
            </div>

            <!-- ---- 模式二面板 ---- -->
            <div id="mode2Panel" class="glass rounded-3xl p-6 space-y-5 hidden">
                <div>
                    <div class="flex items-center mb-3"><span class="step-badge">1</span><span class="text-sm font-bold">搜索个股</span></div>
                    <div class="relative">
                        <input id="stockSearch" type="text" placeholder="输入代码或名称，如：601919">
                        <div id="searchSuggestions"
                             class="absolute w-full mt-1 glass rounded-xl overflow-hidden hidden z-30 shadow-2xl">
                        </div>
                    </div>
                    <p id="selectedInfo" class="text-[10px] text-cyan-400 mt-1 hidden"></p>
                </div>
                <div>
                    <div class="flex items-center mb-3"><span class="step-badge">2</span><span class="text-sm font-bold">选择回测年份</span></div>
                    <div class="flex gap-3">
                        <select id="startYear" class="flex-1">
                            <option value="2020">2020年</option>
                            <option value="2021" selected>2021年</option>
                            <option value="2022">2022年</option>
                            <option value="2023">2023年</option>
                        </select>
                        <select id="endYear" class="flex-1">
                            <option value="2022">2022年</option>
                            <option value="2023">2023年</option>
                            <option value="2024" selected>2024年</option>
                            <option value="2025">2025年</option>
                        </select>
                    </div>
                </div>
                <div>
                    <div class="flex items-center mb-3"><span class="step-badge">3</span><span class="text-sm font-bold">生成收益曲线</span></div>
                    <button id="manualBtn" onclick="doManualBacktest()"
                        class="w-full py-4 bg-purple-500 text-white font-black rounded-2xl hover:bg-purple-400 transition-all text-sm">
                        立即开始回测
                    </button>
                </div>
            </div>

        </aside>

        <!-- ===== 右侧结果区 ===== -->
        <main class="lg:col-span-8 space-y-5">

            <!-- 图表区 -->
            <div class="glass rounded-3xl p-6 flex flex-col" style="min-height:360px">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 id="chartTitle" class="text-lg font-black leading-tight">资产增长曲线</h2>
                        <p id="chartSub" class="text-slate-400 text-xs mt-0.5">点击左侧按钮或下方卡片开始分析</p>
                    </div>
                    <div id="resultBadge"
                         class="hidden shrink-0 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded-lg font-bold text-xs ml-4">
                    </div>
                </div>
                <div id="chartPlaceholder" class="flex-1 flex items-center justify-center text-slate-700 text-sm">
                    等待数据中…
                </div>
                <div class="flex-1" id="chartWrap" style="display:none; min-height:280px">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- 选股推荐列表 -->
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span>
                    AI 优选结果 · 点击卡片立即回测
                </h3>
                <div id="radarList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                    <div class="glass p-4 rounded-2xl text-center opacity-30 col-span-2 sm:col-span-3 md:col-span-4">
                        <div class="text-xs text-slate-500">请先在左侧输入本金并点击「开启量化扫描」</div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script>
// ===== 全局状态 =====
let chartInstance = null;
let selectedCode  = '';
let selectedName  = '';

// ===== 模式切换 =====
function switchMode(m) {
    document.getElementById('mode1Panel').classList.toggle('hidden', m !== 1);
    document.getElementById('mode2Panel').classList.toggle('hidden', m !== 2);
    document.getElementById('mode1Tab').classList.toggle('tab-active', m === 1);
    document.getElementById('mode1Tab').classList.toggle('text-slate-500', m !== 1);
    document.getElementById('mode2Tab').classList.toggle('tab-active', m === 2);
    document.getElementById('mode2Tab').classList.toggle('text-slate-500', m !== 2);
}

// ===== 图表渲染 =====
function renderChart(labels, data, subtitle) {
    document.getElementById('chartPlaceholder').style.display = 'none';
    const wrap = document.getElementById('chartWrap');
    wrap.style.display = 'block';

    const canvas = document.getElementById('mainChart');
    const ctx = canvas.getContext('2d');

    if (chartInstance) { chartInstance.destroy(); }

    const grad = ctx.createLinearGradient(0, 0, 0, 280);
    grad.addColorStop(0, 'rgba(0,242,255,0.3)');
    grad.addColorStop(1, 'rgba(0,242,255,0)');

    chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                label: '账户净值(¥)',
                data,
                borderColor: '#00f2ff',
                borderWidth: 2.5,
                tension: 0.4,
                pointRadius: 0,
                pointHoverRadius: 4,
                fill: true,
                backgroundColor: grad
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 600 },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => `¥${ctx.parsed.y.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2})}`
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: {
                        color: '#475569',
                        maxTicksLimit: 12,
                        maxRotation: 45
                    }
                },
                y: {
                    grid: { color: 'rgba(255,255,255,0.04)' },
                    ticks: {
                        color: '#475569',
                        callback: v => '¥' + v.toLocaleString()
                    }
                }
            }
        }
    });
}

// ===== 模式一：扫描 =====
async function doScan() {
    const principal = parseFloat(document.getElementById('principalInput').value) || 2000;
    const risk      = document.getElementById('riskSelect').value;
    const btn       = document.getElementById('scanBtn');

    btn.innerHTML   = '<span class="loading-dots">AI 正在扫描全市场</span>';
    btn.disabled    = true;

    // 更新顶部余额显示
    document.getElementById('displayBalance').innerText =
        '¥' + principal.toLocaleString('zh-CN', {minimumFractionDigits:2});

    try {
        const res  = await fetch(`/api/scan?principal=${principal}&risk=${risk}`);
        const data = await res.json();

        if (data.error) {
            document.getElementById('radarList').innerHTML =
                `<div class="glass p-4 rounded-2xl col-span-4 text-center text-red-400 text-sm">${data.error}</div>`;
            return;
        }

        const maxPrice = data.max_price || (principal / 100);
        const picks    = data.top_picks || [];

        if (picks.length === 0) {
            document.getElementById('radarList').innerHTML =
                `<div class="glass p-4 rounded-2xl col-span-4 text-center text-slate-400 text-sm">
                    当前筛选条件（本金¥${principal.toLocaleString()}，最高股价¥${maxPrice.toFixed(2)}）未找到符合条件的股票。<br>
                    建议适当增大本金或切换到成长型风险偏好。
                </div>`;
            return;
        }

        document.getElementById('radarList').innerHTML = picks.map(p => `
            <div class="glass p-4 rounded-2xl stock-card border border-transparent"
                 onclick="autoBacktest('${p.code}','${p.name}')">
                <div class="text-[11px] text-slate-400 truncate mb-1">${p.name}</div>
                <div class="font-bold text-sm text-cyan-400 mb-2">${p.code}</div>
                <div class="flex flex-col gap-0.5">
                    <div class="text-[10px] text-emerald-400">股息 ${p.dv}%</div>
                    <div class="text-[10px] text-slate-500">PE ${p.pe} · 股价¥${p.price}</div>
                </div>
            </div>
        `).join('');

        btn.innerHTML = `扫描完成，共 ${picks.length} 支 ✓`;
        setTimeout(() => { btn.innerHTML = '开启量化扫描'; btn.disabled = false; }, 3000);
    } catch (e) {
        btn.innerHTML = '网络错误，请重试';
        btn.disabled  = false;
    }
}

// ===== 模式一点击卡片 → 自动切换到模式二并回测 =====
async function autoBacktest(code, name) {
    switchMode(2);
    selectedCode = code;
    selectedName = name;
    document.getElementById('stockSearch').value = `${name}  (${code})`;
    document.getElementById('selectedInfo').innerText = `已选中：${name} ${code}`;
    document.getElementById('selectedInfo').classList.remove('hidden');
    await doBacktest(code, name);
}

// ===== 模式二：手动回测 =====
async function doManualBacktest() {
    if (!selectedCode) {
        alert('请先在搜索框中选择一支股票');
        return;
    }
    await doBacktest(selectedCode, selectedName);
}

// ===== 核心回测逻辑 =====
async function doBacktest(code, name) {
    const principal  = parseFloat(document.getElementById('principalInput').value) || 2000;
    const start      = document.getElementById('startYear').value;
    const end        = document.getElementById('endYear').value;
    const btn        = document.getElementById('manualBtn');
    const origText   = btn ? btn.innerHTML : '';

    if (btn) { btn.innerHTML = '正在获取历史数据…'; btn.disabled = true; }

    document.getElementById('chartTitle').innerText = `${name} (${code}) 历史收益曲线`;
    document.getElementById('chartSub').innerText   = '数据加载中，请稍候…';

    try {
        const res  = await fetch(`/api/backtest?code=${code}&start_year=${start}&end_year=${end}&principal=${principal}`);
        const data = await res.json();

        if (!data.labels || data.labels.length === 0) {
            document.getElementById('chartSub').innerText = '该股票暂无历史数据';
            if (btn) { btn.innerHTML = origText; btn.disabled = false; }
            return;
        }

        // 更新标题和副标题
        document.getElementById('chartTitle').innerText =
            `${data.name || name} (${code})`;
        document.getElementById('chartSub').innerText =
            `${start}年 → ${end}年  |  本金 ¥${principal.toLocaleString()}  →  终值 ¥${(data.final_value||0).toLocaleString('zh-CN',{minimumFractionDigits:2})}`;

        // 更新收益徽章
        const badge = document.getElementById('resultBadge');
        badge.innerText = `累计收益 ${data.total_return}`;
        badge.classList.remove('hidden');

        // 渲染图表
        renderChart(data.labels, data.history_performance, '');

        if (btn) { btn.innerHTML = '回测完成 ✓'; setTimeout(() => { btn.innerHTML = origText; btn.disabled = false; }, 2000); }
    } catch(e) {
        console.error(e);
        document.getElementById('chartSub').innerText = '请求失败，请检查网络';
        if (btn) { btn.innerHTML = origText; btn.disabled = false; }
    }
}

// ===== 搜索自动补全 =====
const searchInput = document.getElementById('stockSearch');
const suggBox     = document.getElementById('searchSuggestions');
let   searchTimer = null;

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const kw = searchInput.value.trim();
    if (kw.length < 1) { suggBox.classList.add('hidden'); return; }
    searchTimer = setTimeout(async () => {
        try {
            const res  = await fetch(`/api/search?keyword=${encodeURIComponent(kw)}`);
            const data = await res.json();
            if (!data.items || data.items.length === 0) { suggBox.classList.add('hidden'); return; }
            suggBox.innerHTML = data.items.map(i =>
                `<div class="px-4 py-2.5 text-sm flex justify-between items-center"
                      onclick="pickStock('${i.code}','${i.name}')">
                    <span class="font-medium">${i.name}</span>
                    <span class="text-slate-500 text-xs">${i.code}</span>
                 </div>`
            ).join('');
            suggBox.classList.remove('hidden');
        } catch(e) { /* ignore */ }
    }, 300);
});

document.addEventListener('click', e => {
    if (!suggBox.contains(e.target) && e.target !== searchInput)
        suggBox.classList.add('hidden');
});

function pickStock(code, name) {
    selectedCode = code;
    selectedName = name;
    searchInput.value = `${name}  (${code})`;
    document.getElementById('selectedInfo').innerText = `已选中：${name} ${code}`;
    document.getElementById('selectedInfo').classList.remove('hidden');
    suggBox.classList.add('hidden');
}
</script>
</body>
</html>
