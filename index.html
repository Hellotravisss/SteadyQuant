<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteadyQuant · 省心量化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .tab-btn { padding: 10px 18px; font-size:13px; font-weight:700; color:#64748b; cursor:pointer; border-bottom:3px solid transparent; transition:all .2s; }
        .tab-btn.active { color:#00f2ff; border-bottom-color:#00f2ff; }
        .panel { display:none; }
        .panel.active { display:block; }
        .stock-card { transition:all .2s; }
        .stock-card:hover { border-color:#00f2ff; transform:translateY(-2px); }
        input, select { background:#0f1a2e!important; border:1px solid rgba(255,255,255,0.12)!important; color:#e2e8f0!important; }
        .risk-pass { background:#052e16; color:#4ade80; }
        .risk-fail { background:#3b0d0d; color:#f87171; }
    </style>
</head>
<body class="p-6">
<div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-cyan-400 rounded-2xl flex items-center justify-center text-black font-black text-2xl">S</div>
            <div>
                <span class="text-2xl font-extrabold tracking-tighter">SteadyQuant</span>
                <span class="text-xs text-slate-500 ml-2">省心量化</span>
            </div>
        </div>
        <div class="text-right text-sm">
            <div class="text-slate-400 text-xs">当前本金</div>
            <div id="balance" class="font-bold text-cyan-400">¥2,000</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-white/10 mb-8">
        <button onclick="switchTab('scan',this)" class="tab-btn active">🔍 一键选股</button>
        <button onclick="switchTab('riskreview',this)" class="tab-btn">🛡️ 风险审查</button>
        <button onclick="switchTab('portfolio',this)" class="tab-btn">📊 组合回测</button>
    </div>

    <!-- ===================== 一键选股（最小可用版） ===================== -->
    <div id="panel-scan" class="panel active">
        <div class="glass rounded-3xl p-8 max-w-5xl">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                
                <!-- 左侧控制区 -->
                <div class="lg:col-span-4 space-y-6">
                    <div>
                        <div class="text-xs text-slate-400 mb-2 font-bold tracking-widest">本金（元）</div>
                        <input id="principal" type="number" value="2000" class="w-full px-5 py-4 rounded-2xl text-xl font-bold" oninput="updateHint()">
                    </div>
                    
                    <div>
                        <div class="text-xs text-slate-400 mb-2 font-bold tracking-widest">风险偏好</div>
                        <select id="risk" class="w-full px-5 py-4 rounded-2xl text-lg" onchange="updateHint()">
                            <option value="stable">稳健型（PE&lt;15，股息&gt;4%）</option>
                            <option value="growth">成长型（PE&lt;25，股息&gt;2.5%）</option>
                            <option value="aggressive">激进型（PE&lt;55）</option>
                        </select>
                    </div>

                    <button onclick="doScan()" 
                            class="w-full py-5 bg-cyan-400 hover:bg-cyan-300 active:bg-cyan-500 transition-all text-black font-black text-lg rounded-3xl mt-4">
                        开始量化扫描
                    </button>
                    
                    <div class="text-[10px] text-slate-500 pt-2">
                        已集成三大风控红线 · 每只股票自动风控检查
                    </div>
                </div>

                <!-- 结果区 -->
                <div class="lg:col-span-8">
                    <div id="scanResult" class="min-h-[420px]">
                        <div class="h-full flex items-center justify-center text-slate-500 text-sm">
                            点击上方按钮开始扫描
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===================== 风险审查 ===================== -->
    <div id="panel-riskreview" class="panel">
        <div class="glass rounded-3xl p-8 max-w-2xl mx-auto">
            <div class="mb-6">
                <div class="text-2xl font-bold">AI 风险审查员</div>
                <div class="text-sm text-slate-400 mt-1">来自 personal-quant-trading 技能</div>
            </div>

            <div class="space-y-4">
                <input id="riskCode" value="600519.SH" class="w-full px-5 py-4 rounded-2xl" placeholder="股票代码">
                <div class="grid grid-cols-3 gap-4">
                    <input id="riskReturn" value="12.5%" class="px-5 py-4 rounded-2xl" placeholder="总收益">
                    <input id="riskWinrate" value="68%" class="px-5 py-4 rounded-2xl" placeholder="胜率">
                    <input id="riskDD" value="9.2%" class="px-5 py-4 rounded-2xl" placeholder="最大回撤">
                </div>
            </div>

            <button onclick="doRiskReview()" 
                    class="mt-6 w-full py-5 bg-emerald-400 text-black font-black rounded-3xl hover:bg-emerald-300">
                运行 AI 风险审查
            </button>

            <div id="riskResult" class="mt-8 hidden"></div>
        </div>
    </div>

    <!-- ===================== 组合回测（占位） ===================== -->
    <div id="panel-portfolio" class="panel">
        <div class="glass rounded-3xl p-8 text-center text-slate-400">
            组合回测功能已保留后端接口，需时可扩展
        </div>
    </div>

</div>

<script>
function switchTab(tab, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    if (el) el.classList.add('active');
}

function updateHint() {
    // 可扩展价格提示
}

async function doScan() {
    const principal = document.getElementById('principal').value || 2000;
    const risk = document.getElementById('risk').value;
    const container = document.getElementById('scanResult');
    
    container.innerHTML = `<div class="py-12 text-center text-cyan-400">正在扫描...</div>`;

    try {
        const res = await fetch(`/api/scan?principal=${principal}&risk=${risk}`);
        const data = await res.json();

        if (data.error) {
            container.innerHTML = `<div class="text-red-400 p-8">${data.error}</div>`;
            return;
        }

        let html = `<div class="text-xs text-slate-400 mb-4">交易日 ${data.trade_date} · 共 ${data.top_picks.length} 只候选</div>`;
        
        data.top_picks.forEach(stock => {
            const rc = stock.risk_check || {};
            const riskClass = rc.passed ? 'risk-pass' : 'risk-fail';
            
            html += `
            <div class="stock-card glass border border-white/10 rounded-2xl p-5 mb-3 flex justify-between items-center">
                <div>
                    <div class="font-bold">${stock.name} <span class="font-mono text-xs text-slate-400">${stock.code}</span></div>
                    <div class="text-xs mt-1 text-slate-400">PE ${stock.pe} · PB ${stock.pb} · 股息 ${stock.dv}%</div>
                </div>
                <div class="text-right">
                    <div class="text-xl font-bold">¥${stock.price}</div>
                    <div class="text-xs mt-1">评分 <span class="font-bold text-cyan-400">${stock.score}</span></div>
                    
                    <div class="mt-2 text-[10px] px-3 py-0.5 rounded-full inline-block ${riskClass}">
                        ${rc.passed ? '风控通过' : '风控拦截'}
                    </div>
                </div>
            </div>`;
        });
        
        container.innerHTML = html;
    } catch(e) {
        container.innerHTML = `<div class="text-red-400 p-8">扫描失败：${e.message}</div>`;
    }
}

async function doRiskReview() {
    const code = document.getElementById('riskCode').value;
    const ret = document.getElementById('riskReturn').value;
    const wr = document.getElementById('riskWinrate').value;
    const dd = document.getElementById('riskDD').value;

    const resDiv = document.getElementById('riskResult');
    resDiv.classList.remove('hidden');
    resDiv.innerHTML = `<div class="py-8 text-center text-emerald-400">AI 审查中...</div>`;

    try {
        const resp = await fetch(`/api/risk_review?code=${code}&total_return=${ret}&win_rate=${wr}&max_drawdown=${dd}&data_mode=real`);
        const data = await resp.json();
        const r = data.review;

        let html = `
            <div class="border border-white/10 rounded-2xl p-6">
                <div class="flex justify-between mb-4">
                    <div class="font-mono">${data.code}</div>
                    <div class="text-xs px-4 py-1 rounded-full ${r.review_score >= 70 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">
                        评分 ${r.review_score}
                    </div>
                </div>
                <div class="text-lg font-bold mb-4">${r.recommendation}</div>
                <div class="space-y-2 text-sm">
                    ${r.flags.map(f => `<div class="text-rose-400">• ${f}</div>`).join('')}
                </div>
                <div class="mt-6 pt-4 border-t border-white/10 text-[10px] text-slate-500">${r.red_line}</div>
            </div>`;
        resDiv.innerHTML = html;
    } catch(e) {
        resDiv.innerHTML = `<div class="text-red-400">审查失败：${e.message}</div>`;
    }
}

// 初始化默认扫描一次（方便演示）
window.onload = () => {
    setTimeout(() => {
        const scanPanel = document.getElementById('panel-scan');
        if (scanPanel.classList.contains('active')) {
            // 可选：自动触发一次演示扫描
        }
    }, 800);
};
</script>
</body>
</html>
