# Branch B: 21-day specialist — matches production pred_len=21 exactly.
# Starts from v2 weights (or v1 if v2 rejected — edit pretrained paths then).
data:
  data_path: "/root/steady-finetune/data_v2"
  lookback_window: 512
  predict_window: 21
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  tokenizer_epochs: 1          # unused (train_tokenizer=false)
  basemodel_epochs: 15
  batch_size: 96
  log_interval: 100
  num_workers: 12
  seed: 44

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "/root/steady-finetune/finetuned/steady_daily_v2/tokenizer/best_model"
  pretrained_predictor: "/root/steady-finetune/finetuned/steady_daily_v2/basemodel/best_model"

  exp_name: "steady_daily_21d"
  base_path: "/root/steady-finetune/finetuned/"
  base_save_path: ""
  finetuned_tokenizer: "/root/steady-finetune/finetuned/steady_daily_v2/tokenizer/best_model"
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_steady_21d"
  description: "21-trading-day specialist matching production forecast horizon"
  use_comet: false
  train_tokenizer: false
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
