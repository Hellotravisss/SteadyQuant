# Kronos finetune config for steady (multi-market daily bars)
# lookback 512 trading days (~2y), predict 60 days; ~79 instruments, per-file windows

data:
  data_path: "/root/steady-finetune/data"     # DIRECTORY of CSVs (multi_dataset patch)
  lookback_window: 512
  predict_window: 60
  max_context: 512
  clip: 5.0
  train_ratio: 0.9
  val_ratio: 0.1
  test_ratio: 0.0

training:
  tokenizer_epochs: 15
  basemodel_epochs: 10
  batch_size: 64
  log_interval: 50
  num_workers: 8
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1

model_paths:
  pretrained_tokenizer: "/root/steady-finetune/pretrained/Kronos-Tokenizer-base"
  pretrained_predictor: "/root/steady-finetune/pretrained/Kronos-base"

  exp_name: "steady_daily_v1"
  base_path: "/root/steady-finetune/finetuned/"
  base_save_path: ""
  finetuned_tokenizer: ""
  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_steady_finetune"
  description: "Multi-market daily-bar finetune for steady.lowbattery.studio (US/CA/CN/crypto)"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
